name: Compilar APK Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    # libffi da toolchain usa macros removidas do libtool mais recente.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validar regras e conteúdo
        run: |
          python -m compileall -q main.py game.py
          python -m unittest discover -s tests -v
      - name: Instalar dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev gettext
      - name: Instalar toolchain fixa
        run: |
          python -m pip install 'pip==24.3.1' 'setuptools==69.5.1' 'wheel==0.45.1'
          python -m pip install 'buildozer==1.5.0' 'Cython==0.29.36' 'virtualenv==20.26.6'
      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapCondominio-APK
          path: bin/*.apk
          if-no-files-found: error
      - name: Disponibilizar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
