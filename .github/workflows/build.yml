name: Compilar APK Android

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  interface:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Preparar verificação visual
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libmtdev1
          python -m pip install 'kivy==2.3.0' 'Pillow==11.3.0'
      - name: Abrir telas em dois tamanhos de celular
        env:
          KIVY_METRICS_DENSITY: '1'
          KIVY_METRICS_FONTSCALE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_AUDIODRIVER: dummy
        run: |
          xvfb-run -a python tests/smoke_ui.py
          xvfb-run -a python tests/smoke_features.py
          ZAP_WIDTH=360 ZAP_HEIGHT=640 xvfb-run -a python tests/smoke_ui.py
          ZAP_WIDTH=360 ZAP_HEIGHT=640 xvfb-run -a python tests/smoke_features.py
      - name: Capturas das telas reais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telas-do-jogo
          path: screenshots/*.png
          if-no-files-found: ignore
  build:
    needs: interface
    # libffi da toolchain usa macros removidas do libtool mais recente.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reutilizar chave de desenvolvimento entre builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1-${{ github.repository_id }}
      - name: Validar regras e conteúdo
        run: |
          python -m compileall -q main.py game.py ui.py lore.py community.py preferences.py experience.py
          python -m unittest discover -s tests -v
      - name: Instalar dependências Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential autoconf automake libtool libtool-bin pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev gettext
      - name: Instalar toolchain fixa
        run: |
          python -m pip install 'pip==24.3.1' 'setuptools==69.5.1' 'wheel==0.45.1'
          python -m pip install 'buildozer==1.5.0' 'Cython==0.29.36' 'virtualenv==20.26.6'
      - name: Compilar APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ZapCondominio-APK
          path: bin/*.apk
          if-no-files-found: error
      - name: Disponibilizar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
